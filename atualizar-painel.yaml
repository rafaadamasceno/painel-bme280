name: Atualizar Painel BME280

on:
  # Executa automaticamente a cada 10 minutos
  schedule:
    - cron: '*/10 * * * *'
  
  # Permite executar manualmente pelo site do GitHub na aba "Actions"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib numpy

      - name: Executar script de monitoramento
        run: |
          python monitor_bme280.py --csv-url "https://docs.google.com/spreadsheets/d/e/2PACX-1vTat1XuQPLBAyC3nxrijhfW7CVV0uykbqX7qa2e9kZD1cS8AkyiXNveYVSgDEGgfPGSNeBtbSenIs9d/pub?gid=1750629932&single=true&output=csv" --saida "." --formato html --html-refresh 2

      - name: Publicar alterações no GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel_interativo.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática do painel via GitHub Actions" && git push)